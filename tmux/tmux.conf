# Enable mouse
set -g mouse on

# Use xsel for copying to the system clipboard
set -s copy-command 'xsel -i -b'

# Set prefix to Ctrl-b (default)
set -g prefix C-b

# Switch between panes with Ctrl-h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Copy mouse selections to the system clipboard
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xsel -i -b'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xsel -i -b'
